services:
  mysql:
    image: mysql:8.4
    container_name: ppe-business-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ppe_root_local_change_me
      MYSQL_DATABASE: ppe_vi
      MYSQL_USER: ppe_app
      MYSQL_PASSWORD: ppe_local_change_me
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - ppe_mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  ppe_mysql_data:
