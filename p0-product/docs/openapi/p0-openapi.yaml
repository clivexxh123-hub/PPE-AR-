openapi: 3.1.0
info:
  title: PPE VI P0 API
  version: 0.1.0
  description: 产品、画布与 AI 任务中心的首期联调契约。
paths:
  /api/v1/generation-jobs:
    post:
      summary: 创建 AI 生成任务
      operationId: createGenerationJob
      responses:
        '202':
          description: 任务已排队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobAccepted'
  /api/v1/generation-jobs/{jobId}:
    get:
      summary: 查询生成任务状态
      operationId: getGenerationJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 当前任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobStatus'
  /api/v1/generation-jobs/{jobId}/events:
    post:
      summary: AI Worker 回调任务进度或结果
      operationId: reportGenerationJobEvent
      description: 仅供任务中心 / AI Adapter 使用；AI Worker 不直接写业务数据库。
components:
  schemas:
    GenerationJobAccepted:
      type: object
      required: [jobId, status, traceId, pollUrl]
      properties:
        jobId: { type: string, example: gen_01JABC123 }
        status: { type: string, enum: [queued] }
        traceId: { type: string, example: trc_gen_01JABC123 }
        pollUrl: { type: string }
    GenerationJobStatus:
      type: object
      required: [jobId, status, progress, traceId]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, timed_out] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        traceId: { type: string }
        resultAssetId: { type: string, nullable: true }
        modelProfileId: { type: string, nullable: true }
        workflowVersion: { type: string, nullable: true }
