name: PPE AI Regression

on:
  pull_request:

jobs:
  mock-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ppe-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run mock regression
        run: python scripts/run_phase1_regression.py
