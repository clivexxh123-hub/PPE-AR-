services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ppe_dev_root
      MYSQL_DATABASE: ppe_vi
      MYSQL_USER: ppe
      MYSQL_PASSWORD: ppe_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../apps/api/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  mysql-data:
